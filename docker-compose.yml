version: "3.8"

services:
  # ─────────────────────────────────────────
  # Backend API Service (Bun + Hono + Supabase)
  # ─────────────────────────────────────────
  backend:
    build:
      context: ./BackEnd
      dockerfile: Dockerfile
    container_name: kontrakan-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - SUPABASE_URL=${SUPABASE_URL:-https://supa.as-syifa.sch.id}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzg1OTA1ODQ0LCJleHAiOjE5NDM1ODU4NDR9.i934R4a0eZwJPst8FiSslg6YIRMyUF3QBGU9T4ZerYo}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoic2VydmljZV9yb2xlIiwiaXNzIjoic3VwYWJhc2UiLCJpYXQiOjE3ODU5MDU4NDQsImV4cCI6MTk0MzU4NTg0NH0.BcT887GDJO9c1wAFSS-d2tkmVcIFmQ41_XW0b1qWr7U}
      - SUPABASE_SCHEMA=${SUPABASE_SCHEMA:-kontrakan}
      - SUPABASE_STORAGE_BUCKET=${SUPABASE_STORAGE_BUCKET:-ktp_kk_bucket}
    env_file:
      - ./BackEnd/.env
    networks:
      - kontrakan-network

  # ─────────────────────────────────────────
  # Frontend Web Service (React + Bun SPA Runner)
  # ─────────────────────────────────────────
  frontend:
    build:
      context: ./FrontEnd
      dockerfile: Dockerfile
    container_name: kontrakan-frontend
    restart: unless-stopped
    ports:
      - "4001:4001"
    environment:
      - NODE_ENV=production
      - BACKEND_INTERNAL_URL=http://backend:3000
    depends_on:
      - backend
    networks:
      - kontrakan-network

networks:
  kontrakan-network:
    driver: bridge
